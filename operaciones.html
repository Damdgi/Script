<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    ><h1>Suma</h1>
    <script>
        let N1=Number(prompt("Introduce el primer número"));
        let N2=Number(prompt("Introduce el segundo número"));
        suma =N1+N2;
        resta=N1-N2;
        multi= N1*N2;
        divi=N1/N2;
        poten=N1**N2;
        resi=N1%N2;

        document.write("El valor es: "+suma);
        document.write("El valor es: "+resta + "<br>");
        document.write("El valor es: "+multi + "<br>");
        document.write("El valor es: "+divi + "<br>");
        document.write("El valor es: "+poten+ "<br>");
        document.write("El valor es: "+resi + "<br>");

    </script>
</body>
</html>
