<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
    <h1>Datos</h1>
    <script>
        let nombre = prompt("Introduce tu nombre");

    <script>
        document.write("Su nombre es "+ nombre +"<br>");
        document.write("Su edad es "+ edad +"<br>");

        document.write("Su dirección es "+ direc +"<br>");
    </script>
</body>
