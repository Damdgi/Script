<html lang="en">
<head>

</head>
<body>
    <p id="prueba"></p>
    <p id="ejemplo"><p>
    <p id="mensaje"></p>

        let elemento=document.getElementById("prueba");
        elemento.innerHTML="Aprendiendo JavaScript";

        let elemento= document.getElementById("prueba");
        elemento.innerHTML = "Aprendiendo métodos de JavaScript";

        var ejemplo = document.getElementById("ejemplo");

         mensaje.innerHTML = "JavaScript es muy interesante";

        let m=document.querySelector(".prac");
        m,innerHTML="Si me salio";

        let n=document.querySelector("#ejemplo")
        n.innerHTML = "HTML";
    </script>

</body>
</html>
