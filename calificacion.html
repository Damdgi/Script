<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Aprobado/Reprobado</h1>
    <script>
        let calificacion=Number (prompt("Ingresa la calificación: "));

        if(calificacion >= 6){
            document.write ("Usted a aprobado"+"<br>");
        }else{
            document.write("Usted a reprobado");
        }
    </script>
</body>
</html>
